# The version of Tessel this project uses: Tessel's commands, editors and
# the IDE run it with this version, whatever version is installed (and
# install it the first time). `tessel pin` changes it.
tessel = "0.10.0"

# What `tessel publish` publishes. Programs use the library by this name:
# `tessel add csv`, then `import csv`.
[library]
name = "csv"
version = "0.1.0"
description = "Read and write CSV files: quoted fields, any separator, headers, columns as numbers"
license = "MIT"
